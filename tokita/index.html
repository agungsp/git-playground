<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOKITA E-Commerce - Feature 3</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
        <img src="https://i.kym-cdn.com/entries/icons/mobile/000/013/564/doge.jpg" alt="Doge Mascot" class="mascot-nav">
        TOKITA
      </a>

      <button class="btn btn-warning btn-sm fw-bold position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
        🛒 Keranjang
        <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
      </button>
    </div>
  </nav>

  <div class="hero-banner bg-primary text-white py-5 mb-4 position-relative overflow-hidden">
    <div class="container position-relative z-1">
      <div class="row align-items-center text-center text-md-start">
        <div class="col-md-3 text-center mb-3 mb-md-0">
          <img src="https://i.kym-cdn.com/entries/icons/mobile/000/013/564/doge.jpg" alt="Doge Mascot Hero" class="hero-mascot">
        </div>
        <div class="col-md-9">
          <h1 class="fw-bold display-5 mb-2">Selamat Datang di TOKITA</h1>
          <p class="lead mb-0">Platform E-Commerce Kebutuhanmu dengan Integrasi Data Modern</p>
        </div>
      </div>
    </div>
  </div>

  <div class="container mb-5">
    <h4 class="mb-3 fw-bold">Katalog Produk</h4>
    
    <div id="productGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    </div>
  </div>

  <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="cartModalLabel">🛒 Keranjang Belanja</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <ul id="cartList" class="list-group mb-3">
          </ul>
          <div class="d-flex justify-content-between align-items-center fw-bold fs-5 pt-2 border-top">
            <span>Total Bayar:</span>
            <span id="cartTotal" class="text-primary">$0.00</span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-success btn-sm" onclick="checkout()">Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
