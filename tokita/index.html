<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOKITA - E-Commerce Store</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <nav class="navbar bg-white border-bottom sticky-top py-2 py-md-3 shadow-sm">
    <div class="container flex-wrap flex-md-nowrap gap-2">
      <a class="navbar-brand fw-bold fs-3 text-primary d-flex align-items-center gap-2 m-0" href="#">
        <i class="bi bi-bag-heart-fill"></i> TOKITA
      </a>
      
      <div class="w-100 w-md-auto ms-md-auto col-md-4">
        <div class="input-group search-box">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
          <input type="text" id="searchInput" class="form-control bg-light border-start-0 ps-0" placeholder="Cari produk...">
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-3 my-md-4">
    <div id="productGrid" class="row g-3 g-md-4">
      <!-- Loading State -->
      <div class="col-12 text-center my-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-muted fw-medium">Memuat katalog produk...</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
