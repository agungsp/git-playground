<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOKITA</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER & NAVBAR TOKITA -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom mb-4">
    <a class="navbar-brand fw-bold fs-3" href="#">TOKITA</a>
    <div class="container">      
      <!-- INPUT SEARCH (Sesuai Layout Soal) -->
      <div class="d-flex ms-auto" style="max-width: 300px; width: 100%;">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search">🔍</i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="Cari produk...">
        </div>
      </div>
    </div>
  </nav>

  <!-- CONTAINER PRODUK GRID (3 KOLOM) -->
  <div class="container mb-5">
    <div id="productGrid" class="row row-cols-1 row-cols-md-5 g-0">
      <!-- Diisi secara dinamis oleh script.js -->
    </div>
  </div>

  <!-- Bootstrap JS Bundle & Script JS -->
  <script src="sCript.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
