<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOKITA E-Commerce - Feature 2</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
        <img src="https://i.kym-cdn.com/entries/icons/mobile/000/013/564/doge.jpg" alt="Doge Mascot" class="mascot-nav">
        TOKITA
      </a>
    </div>
  </nav>

  <div class="hero-banner bg-primary text-white py-5 mb-4 position-relative overflow-hidden">
    <div class="container position-relative z-1">
      <div class="row align-items-center text-center text-md-start">
        <div class="col-md-3 text-center mb-3 mb-md-0">
          <img src="https://i.kym-cdn.com/entries/icons/mobile/000/013/564/doge.jpg" alt="Doge Mascot Hero" class="hero-mascot">
        </div>
        <div class="col-md-9">
          <h1 class="fw-bold display-5 mb-2">Selamat Datang di TOKITA</h1>
          <p class="lead mb-0">Platform E-Commerce Kebutuhanmu dengan Integrasi Data Modern</p>
        </div>
      </div>
    </div>
  </div>

  <div class="container mb-5">
    <h4 class="mb-3 fw-bold">Katalog Produk</h4>
    
    <div class="row g-2 mb-4">
      <div class="col-md-5">
        <input type="text" id="searchInput" class="form-control" placeholder="Cari nama produk...">
      </div>
      
      <div class="col-md-4">
        <select id="categorySelect" class="form-select">
          <option value="all">Semua Kategori</option>
        </select>
      </div>

      <div class="col-md-3">
        <select id="sortSelect" class="form-select">
          <option value="default">Urutkan Harga</option>
          <option value="low">Harga: Murah ke Mahal</option>
          <option value="high">Harga: Mahal ke Murah</option>
        </select>
      </div>
    </div>

    <div id="productGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
